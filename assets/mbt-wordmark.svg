<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Branch Transformer</title>
  <desc id="desc">Three parallel branch blocks between shared initial and final blocks. A parallel architecture for autoregressive language models.</desc>
  <rect width="1200" height="180" rx="20" fill="#ffffff"/>
  <g transform="translate(190 0)">
  <g transform="translate(38 45) scale(0.9)">
    <rect x="0" y="0" width="100" height="20" rx="10" fill="#263B66"/>
    <rect x="0" y="28" width="28" height="44" rx="8" fill="#4362C7"/>
    <rect x="36" y="28" width="28" height="44" rx="8" fill="#3D9D93"/>
    <rect x="72" y="28" width="28" height="44" rx="8" fill="#995692"/>
    <rect x="0" y="80" width="100" height="20" rx="10" fill="#263B66"/>
  </g>
  <text x="160" y="87" fill="#263B66" font-family="Avenir Next, Avenir, Inter, Arial, sans-serif" font-size="53" font-weight="700" letter-spacing="-1">Multi-Branch Transformer</text>
  <text x="163" y="127" fill="#64747E" font-family="Avenir Next, Avenir, Inter, Arial, sans-serif" font-size="23">Scaling language models through parallel branches</text>
  </g>
</svg>
